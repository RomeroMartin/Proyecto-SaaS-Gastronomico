<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaaS Gastronómico</title>
  <style>
    :root {
      /* Paleta sobria y neutra (un solo tono de grises) */
      --bg: #fafafa; --card: #ffffff; --panel: #fbfbfb;
      --tinta: #18181b; --tinta-2: #3f3f46; --muted: #71717a;
      --borde: #e7e7e9; --borde-2: #ededef;
      --hover: #f4f4f5; --activo: #efeff1;
      --ok: #15803d; --error: #b91c1c;
      --sidebar-w: 250px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--tinta);
      font: 14.5px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    svg { display: block; }

    /* ---------- login ---------- */
    .centro { max-width: 380px; margin: 56px auto; padding: 0 16px; }

    /* ---------- layout ---------- */
    #app { min-height: 100vh; }
    .layout { display: flex; min-height: 100vh; }

    .sidebar {
      width: var(--sidebar-w); background: var(--panel); border-right: 1px solid var(--borde);
      display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; flex-shrink: 0;
    }
    .marca { padding: 16px 18px; border-bottom: 1px solid var(--borde); }
    .marca-empresa { font-size: 14.5px; font-weight: 650; color: var(--tinta); letter-spacing: -.01em; }
    .marca-sub { font-size: 10.5px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }

    #menu { flex: 1; overflow-y: auto; padding: 8px; }
    .menu-grupo { padding: 4px 0; }
    .menu-grupo + .menu-grupo { border-top: 1px solid var(--borde-2); }
    .menu-grupo-head {
      width: 100%; display: flex; align-items: center; gap: 10px;
      background: transparent; color: var(--tinta-2); border: 0; cursor: pointer;
      padding: 8px 10px; border-radius: 7px; font-size: 13px; font-weight: 600; text-align: left;
    }
    .menu-grupo-head:hover { background: var(--hover); }
    .menu-ico { color: var(--muted); display: flex; }
    .menu-ico svg { width: 17px; height: 17px; }
    .menu-titulo { flex: 1; }
    .menu-chevron { color: #a1a1aa; display: flex; transition: transform .15s ease; }
    .menu-chevron svg { width: 15px; height: 15px; }
    .menu-grupo.abierto .menu-chevron { transform: rotate(90deg); }

    .menu-items { display: none; padding: 2px 0 4px; }
    .menu-grupo.abierto .menu-items { display: block; }
    .menu-item {
      display: block; width: 100%; text-align: left; background: transparent;
      color: var(--tinta-2); border: 0; cursor: pointer; padding: 7px 10px 7px 38px;
      border-radius: 7px; font-size: 13.5px;
    }
    .menu-item:hover { background: var(--hover); color: var(--tinta); }
    .menu-item.activo { background: var(--activo); color: var(--tinta); font-weight: 600; }

    .sidebar-footer { padding: 10px 12px; border-top: 1px solid var(--borde); display: flex; align-items: center; gap: 10px; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; background: #e4e4e7; color: var(--tinta-2);
      display: grid; place-items: center; font-weight: 650; font-size: 13px; flex-shrink: 0; }
    .sidebar-footer .datos { flex: 1; min-width: 0; }
    .sidebar-footer .nombre { color: var(--tinta); font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sidebar-footer .rol { color: var(--muted); font-size: 11px; }
    .icon-btn { background: transparent; border: 0; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 6px; display: flex; }
    .icon-btn:hover { color: var(--tinta); background: var(--hover); }
    .icon-btn svg { width: 18px; height: 18px; }

    /* ---------- contenido ---------- */
    .contenido { flex: 1; min-width: 0; }
    .topbar-mobile { display: none; align-items: center; gap: 12px;
      background: var(--card); border-bottom: 1px solid var(--borde); padding: 10px 14px; position: sticky; top: 0; z-index: 5; }
    .topbar-mobile .marca-empresa { font-size: 14px; }
    #btn-menu { background: transparent; border: 0; cursor: pointer; color: var(--tinta); padding: 4px; display: flex; }
    #btn-menu svg { width: 22px; height: 22px; }
    .main-inner { max-width: 960px; margin: 0 auto; padding: 24px 20px 48px; }

    #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; }

    /* ---------- componentes ---------- */
    h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
    h2 { font-size: 15px; margin: 0 0 4px; letter-spacing: -.01em; }
    h3 { letter-spacing: .02em; }
    .card { background: var(--card); border: 1px solid var(--borde); border-radius: 10px; padding: 18px 20px; margin-top: 14px; }
    .card:first-child { margin-top: 0; }
    label { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
    input, select, button { font: inherit; }
    input, select { width: 100%; padding: 8px 11px; border: 1px solid var(--borde); border-radius: 7px; background: #fff; color: var(--tinta); }
    input:focus, select:focus { outline: none; border-color: #a1a1aa; box-shadow: 0 0 0 3px rgba(0,0,0,.04); }
    button { cursor: pointer; border: 1px solid transparent; border-radius: 7px; padding: 8px 14px; background: var(--tinta); color: #fff; font-weight: 550; }
    button:hover { background: #000; }
    button.secundario { background: #fff; color: var(--tinta); border-color: var(--borde); }
    button.secundario:hover { background: var(--hover); }
    button.secundario.resaltado { background: var(--hover); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    button.secundario.resaltado:hover { background: var(--activo); }
    button.btn-baja { background: #fff; color: var(--error); border-color: var(--borde); padding: 4px 10px; font-weight: 500; font-size: 13px; }
    button.btn-baja:hover { background: #fef2f2; border-color: #fecaca; }
    .fila { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .fila > div { flex: 1; min-width: 150px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .muted { color: var(--muted); }
    .error { color: var(--error); }
    [data-tipo="ok"] { color: var(--ok); }
    [data-tipo="error"] { color: var(--error); }
    table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--borde-2); font-size: 13.5px; }
    th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .msg { margin-top: 10px; font-size: 13.5px; }
    .tabla-scroll { overflow-x: auto; }
    .hint { position: relative; display: inline-flex; vertical-align: -3px; color: #a1a1aa; cursor: pointer; }
    .hint:hover, .hint:focus { color: var(--tinta); outline: none; }
    .hint svg { width: 15px; height: 15px; }
    .hint-bubble {
      position: absolute; left: 50%; top: calc(100% + 8px); transform: translateX(-50%);
      display: none; z-index: 50; width: max-content; max-width: 240px; text-align: left;
      background: #18181b; color: #fff; font-size: 12.5px; font-weight: 400; line-height: 1.4;
      padding: 8px 10px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); white-space: normal;
    }
    .hint-bubble::before { content: ""; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      border: 6px solid transparent; border-bottom-color: #18181b; }
    .hint:hover .hint-bubble, .hint:focus .hint-bubble, .hint.abierto .hint-bubble { display: block; }
    @media (max-width: 820px) { .hint-bubble { max-width: 200px; } }

    /* KPIs */
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
    @media (max-width: 700px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
    .kpi { background: var(--card); border: 1px solid var(--borde); border-radius: 10px; padding: 14px 16px; }
    .kpi-t { font-size: 12px; color: var(--muted); }
    .kpi-v { font-size: 20px; font-weight: 700; margin-top: 2px; letter-spacing: -.02em; }
    .kpi-s { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

    /* Toolbar de filtros */
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .toolbar input, .toolbar select { width: auto; min-width: 150px; }
    .toolbar .cuenta { margin-left: auto; color: var(--muted); font-size: 12.5px; }

    /* Chips (rubros) */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 6px 3px 10px; border: 1px solid var(--borde);
      border-radius: 20px; font-size: 12.5px; background: var(--hover); }
    .chip button { background: transparent; border: 0; color: var(--muted); cursor: pointer; padding: 0 2px; font-size: 14px; }
    .chip button:hover { color: var(--error); }

    /* Modal */
    .modal-ov { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 60; display: flex;
      align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
    .modal { background: var(--card); border-radius: 12px; width: 100%; max-width: 520px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--borde); }
    .modal-head h2 { margin: 0; }
    .modal-x { background: transparent; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px 8px; border-radius: 6px; }
    .modal-x:hover { background: var(--hover); color: var(--tinta); }
    .modal-body { padding: 20px; }
    .dos-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    @media (max-width: 640px) { .dos-col { grid-template-columns: 1fr; } }
    tfoot td { font-weight: 700; border-top: 2px solid var(--borde); }

    /* Tabs genéricas (fichas, secciones con vistas alternables) */
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--borde); margin-bottom: 14px; }
    .tab { background: transparent; color: var(--muted); border: 0; border-bottom: 2px solid transparent;
      border-radius: 0; padding: 8px 12px; font-size: 13.5px; font-weight: 600; margin-bottom: -1px; }
    .tab:hover { background: var(--hover); color: var(--tinta); }
    .tab.activo { color: var(--tinta); border-bottom-color: var(--tinta); }
    .resumen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) { .resumen-grid { grid-template-columns: 1fr; } }
    .resumen-box { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 16px; }
    .resumen-box .kpi-t { font-size: 12.5px; color: var(--muted); }
    .resumen-box .kpi-v { font-size: 22px; font-weight: 700; margin-top: 4px; letter-spacing: -.02em; }

    /* Toasts */
    #toast-cont { position: fixed; top: 16px; right: 16px; z-index: 80; display: flex; flex-direction: column; gap: 8px; }
    .toast { background: var(--tinta); color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 13.5px;
      box-shadow: 0 8px 24px rgba(0,0,0,.2); opacity: 0; transform: translateY(-8px); transition: opacity .2s, transform .2s; max-width: 320px; }
    .toast.visible { opacity: 1; transform: translateY(0); }
    .toast-ok { background: var(--ok); }
    .toast-error { background: var(--error); }
    @media (max-width: 640px) { #toast-cont { left: 12px; right: 12px; } .toast { max-width: none; } }

    @media (max-width: 820px) {
      .topbar-mobile { display: flex; }
      .sidebar { position: fixed; left: 0; top: 0; z-index: 30; transform: translateX(-100%); transition: transform .2s ease; }
      #app.sidebar-abierta .sidebar { transform: translateX(0); }
      #app.sidebar-abierta #overlay { display: block; }
    }

    /* ---------- RRHH ---------- */
    .rrhh-badge { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
      border: 1px solid var(--borde); background: var(--hover); color: var(--tinta-2); }
    .rrhh-badge.rojo { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
    .rrhh-badge.ambar { background: #fffbeb; border-color: #fde68a; color: #b45309; }
    .rrhh-badge.verde { background: #f0fdf4; border-color: #bbf7d0; color: #15803d; }
    .rrhh-avatar { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
      background: #e4e4e7; color: var(--tinta-2); font-weight: 650; font-size: 13px; overflow: hidden; }
    .rrhh-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .rrhh-avatar.grande { width: 52px; height: 52px; font-size: 20px; }
    .rrhh-volver { margin-bottom: 14px; padding: 5px 12px; font-size: 13px; }
    .rrhh-ficha-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .rrhh-ficha-nombre { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
    .rrhh-tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--borde); margin-bottom: 16px; }
    .rrhh-tab { background: transparent; color: var(--muted); border: 0; border-bottom: 2px solid transparent;
      border-radius: 0; padding: 8px 12px; font-size: 13.5px; font-weight: 600; margin-bottom: -1px; }
    .rrhh-tab:hover { background: var(--hover); color: var(--tinta); }
    .rrhh-tab.activo { color: var(--tinta); border-bottom-color: var(--tinta); }
    .rrhh-pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
      background: var(--hover); border: 1px solid var(--borde); color: var(--tinta-2); }
    .rrhh-pill.vacaciones { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
    .rrhh-pill.enfermedad { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
    .rrhh-pill.franco { background: #f0fdf4; border-color: #bbf7d0; color: #15803d; }
    .rrhh-pill.licencia_especial { background: #faf5ff; border-color: #e9d5ff; color: #7e22ce; }
    .rrhh-pill.injustificada { background: #fff7ed; border-color: #fed7aa; color: #c2410c; }
    .rrhh-vacio { text-align: center; padding: 24px 0; }
    .rrhh-vacio button { margin-top: 8px; }

    /* Impresión: solo el contenido (Carta, fichas). Oculta menú y controles. */
    @media print {
      .sidebar, .topbar-mobile, .no-print, button { display: none !important; }
      .contenido, .main-inner { max-width: none; margin: 0; padding: 0; }
      .card { border: 0; padding: 6px 0; margin: 0; break-inside: avoid; }
      body { background: #fff; }
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <section id="login" hidden>
    <div class="centro">
      <div class="card">
        <h1>SaaS Gastronómico</h1>
        <p class="muted" style="margin-top:4px;">Ingresá con tu usuario.</p>
        <form id="form-login">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" autocomplete="username" required />
          <label for="login-pass">Contraseña</label>
          <input id="login-pass" type="password" autocomplete="current-password" required />
          <div style="margin-top:16px;"><button type="submit">Ingresar</button></div>
          <p id="login-msg" class="msg" hidden></p>
        </form>
      </div>
    </div>
  </section>

  <!-- APP -->
  <section id="app" hidden>
    <div id="overlay"></div>
    <div class="layout">

      <aside class="sidebar">
        <div class="marca">
          <div class="marca-empresa" id="marca-empresa"></div>
          <div class="marca-sub">SaaS Gastronómico</div>
        </div>
        <nav id="menu"></nav>
        <div class="sidebar-footer">
          <div class="avatar" id="avatar">·</div>
          <div class="datos">
            <div class="nombre" id="user-nombre"></div>
            <div class="rol" id="user-rol"></div>
          </div>
          <button class="icon-btn btn-logout" title="Salir" aria-label="Salir">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </aside>

      <div class="contenido">
        <div class="topbar-mobile">
          <button id="btn-menu" aria-label="Menú">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="marca-empresa" id="marca-empresa-top"></div>
        </div>
        <div class="main-inner">
          <div id="screen"></div>
        </div>
      </div>

    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script type="module" src="./js/saas/ui/app.js"></script>
</body>
</html>
